# https://docs.astral.sh/ruff/configuration/
target-version = "py39"
line-length = 100
src = ["src", "tests"]

# Enable rule bundles
lint.select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "PL", # pylint-worthwhile subset
]

lint.ignore = [
    "E501",    # handled by formatter
    "PLC0415", # lazy imports for platform-specific modules are fine
    "PLR0913", # callback signature dictated by idf.py extension API
    "PLR0917", # same: positional-argument variant, stable since ruff 0.16
]

# Per-folder overrides --------------------------------------------------------
[lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"] # magic-numbers okay in tests
